<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 12 — Web Concept</title>
<meta name="description" content="Unofficial Windows 12 concept desktop running entirely in your browser (HTML/CSS/JS, no dependencies).">

<body>
<div id="screen">
  <div id="boot"><div class="boot-logo"><i></i><i></i><i></i><i></i></div><div class="spinner"></div></div>
  <div id="lock"></div>
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="topbar"></div>
    <div id="icons"></div>
    <div id="windows"></div>
    <div id="snap-preview"></div>
  </div>
  <div id="start" class="flyout glass"></div>
  <div id="quick" class="flyout glass"></div>
  <div id="calendar" class="flyout glass"></div>
  <div id="widgets" class="flyout glass"></div>
  <div id="taskview" class="flyout"></div>
  <div id="taskbar"><div id="tb-left"></div><div id="tb-center" class="pill dock"><div id="dock-apps"></div></div><div id="tb-right"></div></div>
  <div id="showdesk" title="Show desktop"></div>
  <div id="toasts"></div>
  <div id="dim"></div><div id="night"></div>
  <div id="off"><span>Click to power on</span></div>
</div>
